<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Forest Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #0b0f17;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 100%;
            min-width: 0;
            height: 140px;
            overflow: hidden;
            background: #0b0f17;
            border: 1px dashed #00ff6622;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.05);
        }

        /* =========================
           PLAYER
           ========================= */

        .player {
            position: absolute;
            left: 40px;
            top: 55px;
            width: 16px;
            height: 16px;
            border: 2px solid #00bcff;
            filter: drop-shadow(0 0 6px #00bcff);
            z-index: 50;
            animation: creepForward 0.8s ease-in-out infinite alternate;
        }

        @keyframes creepForward {
            from {
                transform: translateX(0) scale(0.95);
            }

            to {
                transform: translateX(10px) scale(1.05);
            }
        }

        /* =========================
           TREE PARTS
           ========================= */

        .leaf-top {
            position: absolute;
            left: 10px;
            top: 0;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid #00ff66;
            filter: drop-shadow(0 0 4px #00ff66);
        }

        .leaf-bottom {
            position: absolute;
            left: 5px;
            top: 15px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #00ff66;
            filter: drop-shadow(0 0 4px #00ff66);
        }

        .trunk {
            position: absolute;
            left: 16px;
            top: 40px;
            width: 8px;
            height: 25px;
            border: 2px solid #00ff66;
            filter: drop-shadow(0 0 4px #00ff66);
        }

        /* =========================
           BACKGROUND FOREST
           ========================= */

        .background-forest {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        .background-tree {
            position: absolute;
            top: 15px;
            left: 0;
            width: 32px;
            height: 75px;
            opacity: 0.32;
            transform: translateX(0);
            animation: backgroundMove 9s linear infinite;
        }

        .background-tree .leaf-top {
            left: 8px;
            border-left-width: 8px;
            border-right-width: 8px;
            border-bottom: 17px solid #00b84f;
            filter: drop-shadow(0 0 2px #00b84f);
        }

        .background-tree .leaf-bottom {
            left: 3px;
            top: 14px;
            border-left-width: 13px;
            border-right-width: 13px;
            border-bottom-width: 22px;
            border-bottom-color: #00b84f;
            filter: drop-shadow(0 0 2px #00b84f);
        }

        .background-tree .trunk {
            left: 13px;
            top: 36px;
            width: 7px;
            height: 23px;
            border-color: #00b84f;
            filter: drop-shadow(0 0 2px #00b84f);
        }

        @keyframes backgroundMove {
            from {
                transform: translateX(110vw);
            }

            to {
                transform: translateX(-60px);
            }
        }

        /* All background trees stay on the SAME Y position */

        .background-tree:nth-child(1) {
            animation-delay: -0.2s;
            transform: scale(0.75);
        }

        .background-tree:nth-child(2) {
            animation-delay: -1.0s;
            transform: scale(0.85);
        }

        .background-tree:nth-child(3) {
            animation-delay: -1.8s;
            transform: scale(0.7);
        }

        .background-tree:nth-child(4) {
            animation-delay: -2.6s;
            transform: scale(0.9);
        }

        .background-tree:nth-child(5) {
            animation-delay: -3.4s;
            transform: scale(0.75);
        }

        .background-tree:nth-child(6) {
            animation-delay: -4.2s;
            transform: scale(0.85);
        }

        .background-tree:nth-child(7) {
            animation-delay: -5.0s;
            transform: scale(0.7);
        }

        .background-tree:nth-child(8) {
            animation-delay: -5.8s;
            transform: scale(0.9);
        }

        .background-tree:nth-child(9) {
            animation-delay: -6.6s;
            transform: scale(0.75);
        }

        .background-tree:nth-child(10) {
            animation-delay: -7.4s;
            transform: scale(0.85);
        }

        .background-tree:nth-child(11) {
            animation-delay: -8.2s;
            transform: scale(0.7);
        }

        .background-tree:nth-child(12) {
            animation-delay: -9.0s;
            transform: scale(0.9);
        }

        /* =========================
           EXTRA BACKGROUND TREES
           ========================= */

        .far-tree {
            position: absolute;
            top: 12px;
            width: 24px;
            height: 65px;
            opacity: 0.18;
            z-index: 1;
            animation: farTreeMove 12s linear infinite;
        }

        .far-tree .leaf-top {
            left: 7px;
            border-left-width: 6px;
            border-right-width: 6px;
            border-bottom-width: 14px;
            border-bottom-color: #008f42;
            filter: none;
        }

        .far-tree .leaf-bottom {
            left: 2px;
            top: 12px;
            border-left-width: 10px;
            border-right-width: 10px;
            border-bottom-width: 18px;
            border-bottom-color: #008f42;
            filter: none;
        }

        .far-tree .trunk {
            left: 10px;
            top: 32px;
            width: 5px;
            height: 20px;
            border-color: #008f42;
            filter: none;
        }

        @keyframes farTreeMove {
            from {
                transform: translateX(110vw);
            }

            to {
                transform: translateX(-50px);
            }
        }

        .far-tree:nth-child(1) {
            animation-delay: -1s;
        }

        .far-tree:nth-child(2) {
            animation-delay: -3s;
        }

        .far-tree:nth-child(3) {
            animation-delay: -5s;
        }

        .far-tree:nth-child(4) {
            animation-delay: -7s;
        }

        .far-tree:nth-child(5) {
            animation-delay: -9s;
        }

        .far-tree:nth-child(6) {
            animation-delay: -11s;
        }

        /* =========================
           FOREGROUND FOREST
           ========================= */

        .foreground-tree {
            position: absolute;
            top: 30px;
            left: 0;
            width: 40px;
            height: 80px;
            z-index: 20;
            animation: foregroundMove 5s linear infinite;
            pointer-events: none;
        }

        .foreground-tree .leaf-top {
            filter: drop-shadow(0 0 7px #00ff66);
        }

        .foreground-tree .leaf-bottom {
            filter: drop-shadow(0 0 8px #00ff66);
        }

        .foreground-tree .trunk {
            filter: drop-shadow(0 0 7px #00ff66);
        }

        @keyframes foregroundMove {
            from {
                transform: translateX(110vw);
            }

            to {
                transform: translateX(-60px);
            }
        }

        .foreground-tree-1 {
            animation-delay: -0.8s;
        }

        .foreground-tree-2 {
            animation-delay: -2.5s;
        }

        .foreground-tree-3 {
            animation-delay: -4.2s;
        }

        .foreground-tree-4 {
            animation-delay: -1.7s;
        }

        /* =========================
           GROUND LINE
           ========================= */

        .axis-line {
            position: absolute;
            top: 63px;
            left: 0;
            width: 100%;
            height: 1px;
            background:
                repeating-linear-gradient(
                    90deg,
                    #00ff6611,
                    #00ff6611 4px,
                    transparent 4px,
                    transparent 8px
                );
            z-index: 25;
        }
    </style>
</head>
