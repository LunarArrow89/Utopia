<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ash Hills Cutscene</title>
<style>
* { box-sizing: border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body { display:flex; align-items:center; justify-content:center; background:#03040a; font-family:Arial,sans-serif; }
.complete { position:absolute; top:7vh; left:50%; transform:translateX(-50%); z-index:20; color:#fff; font-family:"Courier New",monospace; font-weight:900; font-size:clamp(30px,7vw,64px); letter-spacing:6px; text-shadow:3px 0 #38a9ff,-3px 0 #ff3030,0 0 14px rgba(255,255,255,.7); }
.scene { position:relative; width:min(900px,96vw); height:min(500px,78vh); overflow:hidden; background:linear-gradient(to bottom,#03040a 0%,#080b14 58%,#121620 100%); }
.scene::before { content:""; position:absolute; left:-10%; bottom:18%; width:120%; height:55%; background:#303740; clip-path:polygon(0 100%,0 72%,10% 50%,18% 66%,28% 38%,38% 62%,48% 32%,58% 65%,69% 42%,79% 68%,89% 35%,100% 60%,100% 100%); animation:hillsBack 7s linear infinite; opacity:.85; }
.scene::after { content:""; position:absolute; left:-10%; bottom:0; width:120%; height:30%; background:#1d232b; clip-path:polygon(0 100%,0 45%,12% 30%,24% 55%,37% 20%,50% 50%,64% 25%,77% 55%,89% 18%,100% 48%,100% 100%); animation:hillsFront 3.5s linear infinite; }
/* The runners stay in a safe center lane and never reach either edge. */
.runner { position:absolute; top:auto; bottom:31%; width:52px; height:52px; border-radius:5px; z-index:6; }
.blue { left:43%; background:#168cff; border:3px solid #65c3ff; box-shadow:0 0 12px #168cff,0 0 30px #168cff,0 0 60px rgba(22,140,255,.65); animation:runBlue 1s ease-in-out infinite; }
.orange { left:51%; width:44px; height:44px; background:#ff7a18; border:3px solid #ffb15c; box-shadow:0 0 12px #ff6a00,0 0 30px #ff6a00,0 0 55px rgba(255,106,0,.6); animation:runOrange 1s ease-in-out infinite .15s; }
/* Red triangles remain behind the runners and float above the ground. */
.triangle { position:absolute; top:auto; bottom:45%; width:0; height:0; border-top:18px solid transparent; border-bottom:18px solid transparent; border-left:34px solid #ff2525; filter:drop-shadow(0 0 8px #ff2020) drop-shadow(0 0 20px rgba(255,0,0,.7)); z-index:4; }
.t1 { left:8%; animation:floatChase 2.2s linear infinite; }
.t2 { left:14%; bottom:55%; animation:floatChase 2.6s linear infinite .15s; }
.t3 { left:20%; bottom:39%; animation:floatChase 2.4s linear infinite .3s; }
.t4 { left:4%; bottom:62%; animation:floatChase 2.8s linear infinite .45s; }
.t5 { left:17%; bottom:68%; animation:floatChase 2.5s linear infinite .6s; }
.t6 { left:25%; bottom:51%; animation:floatChase 2.7s linear infinite .75s; }
.t7 { left:10%; bottom:34%; animation:floatChase 2.3s linear infinite .9s; }
@keyframes runBlue { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
@keyframes runOrange { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
@keyframes hillsBack { from { transform:translateX(0); } to { transform:translateX(-12%); } }
@keyframes hillsFront { from { transform:translateX(0); } to { transform:translateX(-22%); } }
@keyframes floatChase { 0% { transform:translateX(-15px) translateY(0); } 25% { transform:translateX(35px) translateY(-12px); } 50% { transform:translateX(75px) translateY(5px); } 75% { transform:translateX(35px) translateY(14px); } 100% { transform:translateX(-15px) translateY(0); } }
button { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); z-index:10; padding:10px 28px; border:1px solid #38a9ff; border-radius:10px; background:#0b1020; color:white; font-size:16px; cursor:pointer; box-shadow:0 0 14px rgba(56,169,255,.5); }
</style>
</head>
<body>
<div class="complete">COMPLETE</div>
<div class="scene">
<div class="triangle t1"></div><div class="triangle t2"></div><div class="triangle t3"></div><div class="triangle t4"></div><div class="triangle t5"></div><div class="triangle t6"></div><div class="triangle t7"></div>
<div class="runner blue"></div><div class="runner orange"></div>
</div>
<button type="button" onclick="parent.finishAshHillsCutscene()">Continue</button>
</body>
</html>
