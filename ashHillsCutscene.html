<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ash Hills Cutscene</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #03040a;
    font-family: Arial, sans-serif;
}
.scene {
    position: relative;
    width: min(900px, 96vw);
    height: min(500px, 78vh);
    overflow: hidden;
    background: linear-gradient(to bottom, #03040a 0%, #080b14 58%, #121620 100%);
}

/* Endless moving Ash Hills. The characters stay safely inside the scene. */
.scene::before {
    content: "";
    position: absolute;
    left: -100%;
    bottom: 18%;
    width: 300%;
    height: 55%;
    background: #4b535e;
    clip-path: polygon(0 100%, 0 72%, 6% 50%, 12% 66%, 18% 38%, 24% 62%, 30% 32%, 36% 65%, 43% 42%, 50% 68%, 57% 35%, 64% 60%, 71% 40%, 78% 67%, 85% 32%, 92% 61%, 100% 43%, 100% 100%);
    animation: endlessHillsBack 9s linear infinite;
    opacity: .85;
}
.scene::after {
    content: "";
    position: absolute;
    left: -100%;
    bottom: 0;
    width: 300%;
    height: 31%;
    background: #20262f;
    clip-path: polygon(0 100%, 0 45%, 6% 30%, 12% 55%, 18% 20%, 25% 50%, 32% 25%, 39% 55%, 46% 18%, 53% 48%, 60% 28%, 67% 55%, 74% 20%, 82% 48%, 90% 18%, 100% 48%, 100% 100%);
    animation: endlessHillsFront 4.5s linear infinite;
}

.runner {
    position: absolute;
    top: 52%;
    width: 52px;
    height: 52px;
    border-radius: 5px;
    z-index: 5;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

/* Both runners face left. They stay around the middle instead of reaching an edge. */
.blue {
    left: 43%;
    color: #168cff;
    background: #168cff;
    border: 3px solid #65c3ff;
    box-shadow: 0 0 12px #168cff, 0 0 30px #168cff, 0 0 60px rgba(22,140,255,.65);
    transform: translateY(-50%) scaleX(-1);
    animation: blueRun 0.55s ease-in-out infinite alternate;
}
.orange {
    left: 50%;
    width: 44px;
    height: 44px;
    color: #ff7a18;
    background: #ff7a18;
    border: 3px solid #ffb15c;
    box-shadow: 0 0 12px #ff6a00, 0 0 30px #ff6a00, 0 0 55px rgba(255,106,0,.6);
    transform: translateY(-50%) scaleX(-1);
    animation: orangeRun 0.55s ease-in-out infinite alternate;
}

/* Red triangles stay behind the runners and also face left. */
.triangle {
    position: absolute;
    top: 50%;
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-left: 34px solid #ff2525;
    filter: drop-shadow(0 0 8px #ff2020) drop-shadow(0 0 20px rgba(255,0,0,.7));
    z-index: 4;
    transform: scaleX(-1);
}
.t1 { left: 31%; top: 50%; animation: redRun1 .7s ease-in-out infinite alternate; }
.t2 { left: 24%; top: 43%; animation: redRun2 .62s ease-in-out infinite alternate; }
.t3 { left: 28%; top: 57%; animation: redRun3 .66s ease-in-out infinite alternate; }
.t4 { left: 20%; top: 37%; animation: redRun1 .8s ease-in-out infinite alternate-reverse; }
.t5 { left: 22%; top: 65%; animation: redRun2 .72s ease-in-out infinite alternate-reverse; }
.t6 { left: 34%; top: 32%; animation: redRun3 .75s ease-in-out infinite alternate; }
.t7 { left: 33%; top: 68%; animation: redRun1 .68s ease-in-out infinite alternate-reverse; }

.triangle::after {
    content: "";
    position: absolute;
    width: 8px;
    height: 8px;
    left: -45px;
    top: -4px;
    border-radius: 50%;
    background: #ff2525;
    box-shadow: 0 0 8px #ff2525;
    animation: sparks .18s linear infinite alternate;
}

/* Small vertical bounces make the squares and triangles look like they are running. */
@keyframes blueRun {
    from { transform: translateY(-50%) translateY(5px) scaleX(-1); }
    to   { transform: translateY(-50%) translateY(-7px) scaleX(-1); }
}
@keyframes orangeRun {
    from { transform: translateY(-50%) translateY(6px) scaleX(-1); }
    to   { transform: translateY(-50%) translateY(-6px) scaleX(-1); }
}
@keyframes redRun1 {
    from { transform: translateY(6px) scaleX(-1); }
    to   { transform: translateY(-8px) scaleX(-1); }
}
@keyframes redRun2 {
    from { transform: translateY(-4px) scaleX(-1); }
    to   { transform: translateY(9px) scaleX(-1); }
}
@keyframes redRun3 {
    from { transform: translateY(8px) scaleX(-1); }
    to   { transform: translateY(-6px) scaleX(-1); }
}

/* The world moves left forever, making the runners appear to run forward. */
@keyframes endlessHillsBack {
    from { transform: translateX(0); }
    to { transform: translateX(33.333%); }
}
@keyframes endlessHillsFront {
    from { transform: translateX(0); }
    to { transform: translateX(33.333%); }
}
@keyframes sparks {
    from { opacity: .3; transform: translateX(0); }
    to { opacity: 1; transform: translateX(-12px); }
}

button {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 10;
    padding: 10px 28px;
    border: 1px solid #38a9ff;
    border-radius: 10px;
    background: #0b1020;
    color: white;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(56,169,255,.5);
}
.complete {
    position: absolute;
    top: 7vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    color: #fff;
    font-family: "Courier New", monospace;
    font-weight: 900;
    font-size: clamp(30px, 7vw, 64px);
    letter-spacing: 6px;
    text-shadow: 3px 0 #38a9ff, -3px 0 #ff3030, 0 0 14px rgba(255,255,255,.7);
    image-rendering: pixelated;
}
</style>
</head>
<body>
<div class="complete">COMPLETE</div>
<div class="scene">
    <div class="triangle t1"></div>
    <div class="triangle t2"></div>
    <div class="triangle t3"></div>
    <div class="triangle t4"></div>
    <div class="triangle t5"></div>
    <div class="triangle t6"></div>
    <div class="triangle t7"></div>
    <div class="runner blue"></div>
    <div class="runner orange"></div>
</div>
<button type="button" onclick="parent.finishAshHillsCutscene()">Continue</button>
</body>
</html>
