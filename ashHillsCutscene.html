<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ash Hills Cutscene</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 50%, #111b35 0%, #050711 48%, #010207 100%);
    color: white;
    font-family: Arial, sans-serif;
}
.stage {
    position: relative;
    width: min(390px, 90vw);
    height: min(520px, 72vh);
    overflow: hidden;
}
.blue, .orange, .chaser {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center;
}
.blue {
    width: 38px;
    height: 38px;
    border: 3px solid #38a9ff;
    background: rgba(30, 120, 255, .14);
    box-shadow: 0 0 12px #168cff, 0 0 28px rgba(22,140,255,.7);
}
.blue-one { animation: blueOne 6s linear infinite; }
.blue-two {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    animation: blueTwo 6s linear infinite;
}
.blue-three {
    width: 20px;
    height: 20px;
    transform: rotate(45deg);
    animation: blueThree 6s linear infinite;
}
.orange {
    width: 26px;
    height: 26px;
    background: #ff8a22;
    box-shadow: 0 0 12px #ff6a00, 0 0 28px rgba(255,106,0,.75);
}
.orange-one { animation: orangeOne 6s linear infinite; }
.orange-two {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    animation: orangeTwo 6s linear infinite;
}
.chaser {
    width: 0;
    height: 0;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    border-left: 27px solid #ff3030;
    filter: drop-shadow(0 0 9px #ff2020) drop-shadow(0 0 20px rgba(255,0,0,.65));
}
.red-one { animation: redOne 3.2s linear infinite; }
.red-two { animation: redTwo 3.8s linear infinite; }
.red-three { animation: redThree 4.4s linear infinite; }

button {
    width: min(260px, 80vw);
    margin-top: 10px;
    padding: 12px 18px;
    border: 1px solid #328cff;
    border-radius: 12px;
    background: #111a2e;
    color: white;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(30,140,255,.25);
}

@keyframes blueOne {
    0%,100% { transform: translate(-150px,-100px) rotate(0deg); }
    25% { transform: translate(40px,-155px) rotate(90deg); }
    50% { transform: translate(145px,10px) rotate(180deg); }
    75% { transform: translate(-20px,145px) rotate(270deg); }
}
@keyframes blueTwo {
    0%,100% { transform: translate(130px,-100px); }
    25% { transform: translate(-10px,-155px); }
    50% { transform: translate(-145px,15px); }
    75% { transform: translate(25px,145px); }
}
@keyframes blueThree {
    0%,100% { transform: translate(-75px,125px) rotate(45deg); }
    50% { transform: translate(105px,-125px) rotate(225deg); }
}
@keyframes orangeOne {
    0%,100% { transform: translate(-100px,-25px); }
    25% { transform: translate(5px,-80px); }
    50% { transform: translate(100px,0); }
    75% { transform: translate(0,80px); }
}
@keyframes orangeTwo {
    0%,100% { transform: translate(75px,40px); }
    50% { transform: translate(-75px,-40px); }
}
@keyframes redOne {
    0% { transform: translate(185px,-210px) rotate(145deg); }
    50% { transform: translate(-155px,15px) rotate(325deg); }
    100% { transform: translate(185px,190px) rotate(505deg); }
}
@keyframes redTwo {
    0% { transform: translate(-190px,190px) rotate(-45deg); }
    50% { transform: translate(145px,40px) rotate(135deg); }
    100% { transform: translate(-190px,-190px) rotate(315deg); }
}
@keyframes redThree {
    0% { transform: translate(0,235px) rotate(-90deg); }
    50% { transform: translate(-170px,-80px) rotate(90deg); }
    100% { transform: translate(175px,-220px) rotate(270deg); }
}
</style>
</head>
<body>
<div class="stage">
    <div class="blue blue-one"></div>
    <div class="blue blue-two"></div>
    <div class="blue blue-three"></div>
    <div class="orange orange-one"></div>
    <div class="orange orange-two"></div>
    <div class="chaser red-one"></div>
    <div class="chaser red-two"></div>
    <div class="chaser red-three"></div>
</div>
<button type="button" onclick="parent.finishAshHillsCutscene()">Continue</button>
</body>
</html>
