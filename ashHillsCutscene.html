<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ash Hills Complete</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#05070d;color:#fff;font-family:Arial,sans-serif}
.cutscene{width:min(520px,92vw);text-align:center;padding:35px 24px;background:#0b101a;border:1px solid #29364a;border-radius:18px;box-shadow:0 0 35px rgba(0,0,0,.6)}
.title{font-family:"Courier New",monospace;font-size:clamp(34px,10vw,62px);font-weight:900;letter-spacing:5px;margin-bottom:28px;text-shadow:3px 3px #168cff, -3px -3px #ff3030}
.text{min-height:130px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,4.5vw,25px);line-height:1.5;margin-bottom:25px}
button{padding:12px 30px;border:1px solid #38a9ff;border-radius:10px;background:#111b2d;color:white;font-size:17px;cursor:pointer;box-shadow:0 0 14px rgba(56,169,255,.4)}
button:hover{background:#172641}
</style>
</head>
<body>
<div class="cutscene">
<div class="title">COMPLETE</div>
<div id="text" class="text">The Ash Hills fall silent.</div>
<button id="next" onclick="nextLine()">Continue</button>
</div>
<script>
const lines=[
"The Ash Hills fall silent.",
"You look back at the road you traveled.",
"The rescued civilian is safe.",
"You helped someone make it through the Ash Hills.",
"Your journey continues back in Oakshade Village.",
"This place is starting to feel like home."
];
let step=0;
function nextLine(){
 step++;
 if(step<lines.length){document.getElementById('text').textContent=lines[step];return;}
 if(parent&&typeof parent.finishAshHillsCutscene==='function')parent.finishAshHillsCutscene();
}
</script>
</body>
</html>
